version: 2
updates:
  # Configuration for npm (Node.js) dependencies in the root directory
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly" # Check for changes weekly (can be changed to "daily" or "monthly")
    open-pull-requests-limit: 10 # Maximum number of open PRs at a time
    commit-message:
      prefix: "chore(deps)"

  # Configuration for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
